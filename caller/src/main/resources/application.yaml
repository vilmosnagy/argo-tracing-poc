spring:
  application:
    name: caller

argo:
  server-url: ${ARGO_SERVER_URL:http://argo-server.argo:2746}
  namespace: ${ARGO_NAMESPACE:argo}

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector.argo:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "
